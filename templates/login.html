<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | VANTA</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #111416;
            --panel: #1a1d20;
            --border: #343a3e;
            --text: #e7eaec;
            --muted: #a2aaaf;
            --accent: #8ab0cc;
            --accent-background: #395f7d;
            --accent-hover: #477394;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--background);
            color: var(--text);
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button, input { font: inherit; }
        .site-header {
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 0 32px;
            border-bottom: 1px solid #2b3034;
        }
        .brand { display: flex; align-items: baseline; gap: 12px; }
        .brand-name { font-size: 18px; font-weight: 700; }
        .brand-description, .header-note { color: var(--muted); font-size: 12px; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px 76px; }
        .login-container { width: 100%; max-width: 420px; padding: 32px; border: 1px solid var(--border); border-radius: 5px; background: var(--panel); }
        .login-header { margin-bottom: 27px; }
        .login-header h1 { margin: 0; font-size: 23px; font-weight: 650; line-height: 1.25; }
        .login-header p { margin: 8px 0 0; color: var(--muted); }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 600; }
        .form-group input { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #454d52; border-radius: 4px; background: #141719; color: var(--text); }
        .form-group input:focus-visible, .btn-login:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .btn-login { width: 100%; min-height: 42px; margin-top: 5px; padding: 10px 14px; border: 1px solid var(--accent-background); border-radius: 4px; background: var(--accent-background); color: #fff; font-weight: 600; cursor: pointer; }
        .btn-login:hover { border-color: var(--accent-hover); background: var(--accent-hover); }
        .error-message { margin-bottom: 20px; padding: 11px 12px; border: 1px solid #794b4b; border-radius: 4px; background: #332323; color: #e6a3a3; font-size: 13px; }
        .creds-box { margin-top: 23px; padding-top: 19px; border-top: 1px solid #2b3034; color: var(--muted); font-size: 12px; }
        .creds-label { margin-bottom: 7px; color: var(--text); font-weight: 600; }
        .creds-row { display: flex; justify-content: space-between; gap: 12px; margin-top: 4px; }
        .creds-row code { color: var(--text); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
        .page-footer { margin-top: 20px; color: #858f96; font-size: 12px; text-align: center; }
        @media (max-width: 480px) {
            .site-header { min-height: 58px; padding: 0 20px; }
            .header-note { display: none; }
            .login-container { padding: 25px 22px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand"><span class="brand-name">VANTA</span><span class="brand-description">MTD Controller</span></div>
        <span class="header-note">Network security</span>
    </header>
    <main>
        <section class="login-container" aria-labelledby="login-title">
            <div class="login-header">
                <h1 id="login-title">Sign in</h1>
                <p>Use your account to access the command center.</p>
            </div>

            {% if error %}
            <div class="error-message" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <input type="hidden" name="mfa_code" value="">
                <input type="hidden" name="device_id" value="dashboard-browser">
                <input type="hidden" name="device_trust" value="trusted">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-login">Sign in</button>
            </form>
            <div class="creds-box">
                <div class="creds-label">Default credentials</div>
                <div class="creds-row"><span>Username</span><code>admin</code></div>
                <div class="creds-row"><span>Password</span><code>mtd2024</code></div>
            </div>
        </section>
        <p class="page-footer">Authorized users only</p>
    </main>
</body>
</html>
